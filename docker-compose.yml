services:
  watched-cleaner:
    build: .
    image: watched-cleaner:latest
    container_name: watched-cleaner
    restart: unless-stopped
    # host 网络：容器与宿主机共享网络，用 127.0.0.1 访问 qB/TR(本机回环免认证)，
    # WebUI 直接监听宿主机端口(无需 ports 映射)
    network_mode: host
    volumes:
      # 飞牛影视数据库目录(只读挂载) —— 对应 config.json 的 fnnas.db_path
      - /usr/local/apps/@appdata/trim.media/database:/fnnas-db:ro

      # 配置目录：挂载宿主机 ./config。容器首次启动自动在里面生成
      # config.json / downloaders.json，之后设置都留在宿主机上。
      # 该目录不在 git 里，所以 git pull、重建镜像都不会覆盖配置。
      - ./config:/app/config

      # 资源数据盘(与宿主机相同路径挂载)，对应 config.json 的 path_map
      - /vol1/1000:/vol1/1000
      - /vol2/1000:/vol2/1000
    environment:
      - TZ=Asia/Shanghai
      # WebUI 端口，默认 5000。想改端口也可以直接改 config/config.json。
      # - WEB_PORT=5000
